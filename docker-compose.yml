services:
  ocr:
    build: ./ocr
    ports:
      - "5001:5001"
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - OCR_URL=http://ocr:5001
      # LLM HTTP 超时 (秒, 默认 120; 网关/思维链模型慢可调大, 如 300)
      # - LLM_TIMEOUT_SECS=120
      # LLM 调试 (1 = 打印请求体大小与上游原始响应)
      # - LLM_DEBUG=1
      # 配置 LLM (可选)
      # - OPENAI_API_KEY=sk-xxx
      # - OPENAI_BASE_URL=https://api.openai.com/v1
      # - OPENAI_MODEL=gpt-4o-mini
    depends_on:
      - ocr
    restart: unless-stopped
